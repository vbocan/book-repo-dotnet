name: CI
on: [push, pull_request]
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build C# examples
        run: |
          for p in $(find csharp -name '*.csproj'); do echo "== $p"; dotnet build -v q "$p" || exit 1; done
      - name: Type-check F# scripts
        run: |
          for s in $(find fsharp -name '*.fsx'); do echo "== $s"; dotnet fsi "$s" </dev/null || exit 1; done
